name: Linux

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      compile_cuda:
        description: Also compile CUDA 12.8 (no GPU execution)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        backend: [cpu, vulkan]
    steps:
      - uses: actions/checkout@v4
      - name: Install build and media tools
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build g++ libpng-dev libjpeg-dev libcurl4-openssl-dev ffmpeg binutils python3-pip
          python3 -m pip install cmake==3.31.6
      - name: Check glibc baseline and checker
        run: |
          python3 tools/check_glibc.py --check-host
          python3 -m unittest discover -s tools -p test_check_glibc.py
      - name: Configure
        shell: bash
        run: |
          vulkan=OFF
          if [[ '${{ matrix.backend }}' == vulkan ]]; then vulkan=ON; fi
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_LIBDIR=lib \
            -DSLOPFAB_ENABLE_CUDA=OFF -DSLOPFAB_ENABLE_VULKAN="$vulkan" \
            -DSLOPFAB_TOKENIZER_FILE="$PWD/tests/fixtures/tokenizer.json"
      - name: Build
        run: cmake --build build/linux --parallel 2
      - name: Host and C API tests
        run: ctest --test-dir build/linux --output-on-failure -E '^(vulkan|kernels|tensor_backends)($|_)'
      - name: Installed CLI and shared library
        shell: bash
        run: |
          cmake --install build/linux --prefix "$RUNNER_TEMP/slopfab"
          python3 tools/check_glibc.py "$RUNNER_TEMP/slopfab"
          "$RUNNER_TEMP/slopfab/bin/slopfab" --help
          "$RUNNER_TEMP/slopfab/bin/slopfab" settings get --agent
          "$RUNNER_TEMP/slopfab/bin/slopfab" mods list --agent
          (cd "$RUNNER_TEMP" && "$RUNNER_TEMP/slopfab/bin/slopfab" tokenize hello)
          test -f "$RUNNER_TEMP/slopfab/share/licenses/slopfab/LICENSE"
          if [[ '${{ matrix.backend }}' == vulkan ]]; then
            test -f "$RUNNER_TEMP/slopfab/include/slopfab/capi.h"
            test -L "$RUNNER_TEMP/slopfab/lib/libslopfab.so"
            python3 -c 'import ctypes, os; lib = ctypes.CDLL(os.environ["RUNNER_TEMP"] + "/slopfab/lib/libslopfab.so"); lib.slopfab_capi_version.restype = ctypes.c_uint32; assert lib.slopfab_capi_version() >> 24 == 1'
          fi
          cpack --config build/linux/CPackConfig.cmake -B build/packages
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.backend }}-test-build
          path: build/packages/*.tar.gz

  cuda-compile:
    if: github.event_name == 'workflow_dispatch' && inputs.compile_cuda
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.8.1-devel-ubuntu22.04
    steps:
      - name: Install build tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates python3-pip binutils ninja-build g++ libpng-dev libjpeg-dev libcurl4-openssl-dev
          python3 -m pip install cmake==3.31.6
      - uses: actions/checkout@v4
      - name: Configure CUDA and Vulkan
        run: |
          cmake -S . -B build/linux -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CUDA_ARCHITECTURES=86 \
            -DSLOPFAB_ENABLE_CUDA=ON -DSLOPFAB_ENABLE_VULKAN=ON \
            -DSLOPFAB_BUILD_TESTS=OFF \
            -DSLOPFAB_TOKENIZER_FILE="$GITHUB_WORKSPACE/tests/fixtures/tokenizer.json"
      - name: Compile CLI and C API
        run: cmake --build build/linux --target slopfab slopfab_c --parallel 2
      - name: Check CUDA artifacts against glibc baseline
        run: python3 tools/check_glibc.py --check-host build/linux/slopfab build/linux/libslopfab.so
